name: Update stats

# Rewrites README.md from TEMPLATE.md with live GitHub numbers. Needs a
# USER_TOKEN secret: a personal access token with read:user, since the
# default GITHUB_TOKEN cannot see account-wide contribution totals.
on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate README.md
        uses: orhun/profile-readme-stats@master
        with:
          token: ${{ secrets.USER_TOKEN }}
          lifetimeStreak: true
      - name: Commit if anything changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update stats"
            git push
          fi
